name: Windows RDP Tailscale

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Buat Password User Administrator
      run: |
        $Password = ConvertTo-SecureString "Rahasia123!" -AsPlainText -Force
        New-LocalUser "RDPUser" -Password $Password -FullName "RDP User" -Description "User RDP"
        Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"

    - name: Unduh & Install Tailscale
      run: |
        choco install tailscale -y

    - name: Hubungkan Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes

    - name: Tampilkan Informasi Koneksi RDP
      run: |
        Start-Sleep -Seconds 5
        $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
        Write-Host "=========================================="
        Write-Host "IP KONEKSI RDP  : $ip"
        Write-Host "USERNAME        : RDPUser"
        Write-Host "PASSWORD        : Rahasia123!"
        Write-Host "=========================================="

    - name: Menjaga RDP Tetap Aktif
      run: |
        $i = 0
        while ($i -lt 360) {
          Start-Sleep -Seconds 60
          $i++
        }
